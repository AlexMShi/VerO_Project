{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pick School | Ver·O</title>
    <meta
      name="description"
      content="Student review platform for schools, professors, and academic programmes."
    >

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=20260521-user-header">
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include "partials/site-header.html" %}

<main id="main-content">
      <section class="page-hero">
        <article class="container text-center py-5">
          <h1 class="mock-title mb-5">Explore your school of interest.</h1>

          <form
            class="search-panel mx-auto"
            action="{% url 'school_results' %}"
            method="get"
            aria-label="Search school form"
          >
            <label class="visually-hidden" for="school-search">
              School name
            </label>

            <section class="input-group input-group-lg justify-content-center">
              <input
                id="school-search"
                name="school"
                class="form-control search-control"
                type="search"
                placeholder="Enter the name of school here"
              >

              <button
                class="btn btn-brand rounded-pill ms-md-3 px-5 mt-3 mt-md-0"
                type="submit"
              >
                Search
              </button>
            </section>
          </form>
        </article>
      </section>
    </main>

    <footer class="site-footer bg-cream border-top py-3">
      <section class="container-fluid px-4 d-flex flex-column flex-md-row justify-content-between gap-3">
        <p class="mb-0">
          &copy; 2026 Ver·O. webpage prototype created by Mingyuan & Mengxue
        </p>

        <nav aria-label="Footer navigation">
          <a class="footer-link me-3" href="{% url 'contact' %}#contact">Contact</a>
          <a class="footer-link me-3" href="{% url 'contact' %}#imprint">Imprint</a>
          <a class="footer-link" href="{% url 'contact' %}#sources">Image sources</a>
        </nav>
      </section>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
