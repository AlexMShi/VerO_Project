{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submitted | Ver·O</title>
    <meta
      name="description"
      content="Submission confirmation page for Ver·O."
    >

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=20260521-user-header">
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include "partials/site-header.html" %}

<main id="main-content">
      <section class="page-hero">
        <article class="container text-center py-5">
          <section class="panel p-4 p-md-5 mx-auto" style="max-width: 760px;">
            <h1 class="display-5 section-title mb-3" id="submitted-title">
              Submitted
            </h1>

            <p class="lead mb-4" id="submitted-message">
              Your information has been submitted successfully.
            </p>

            <section class="d-flex flex-column flex-sm-row justify-content-center gap-3">
              <a
                class="btn btn-brand rounded-pill px-5"
                id="submitted-primary-link"
                href="{% url 'home' %}"
              >
                Back to Home
              </a>

              <a class="btn btn-soft rounded-pill px-5" href="{% url 'school_search' %}">
                Start another search
              </a>
            </section>
          </section>
        </article>
      </section>
    </main>

    <footer class="site-footer bg-cream border-top py-3">
      <section class="container-fluid px-4 d-flex flex-column flex-md-row justify-content-between gap-3">
        <p class="mb-0">
          &copy; 2026 Ver·O. webpage prototype created by Mingyuan & Mengxue
        </p>

        <nav aria-label="Footer navigation">
          <a class="footer-link me-3" href="{% url 'contact' %}#contact">Contact</a>
          <a class="footer-link me-3" href="{% url 'contact' %}#imprint">Imprint</a>
          <a class="footer-link" href="{% url 'contact' %}#sources">Image sources</a>
        </nav>
      </section>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
